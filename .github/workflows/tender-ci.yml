name: 霍邱招投标升级回归测试

on:
  pull_request:
    paths:
      - "apps/tender/**"
      - ".github/workflows/tender-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 检查语法
        run: python -m compileall -q apps/tender/scripts apps/tender/tests
      - name: 公告与监控回归测试
        run: python -m unittest discover -s apps/tender/tests -p "test_*.py" -v
