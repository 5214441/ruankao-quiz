name: 更新并部署柱子万能工具箱

on:
  push:
    branches: ["main"]

  schedule:
    # 北京时间 08:17、11:17、14:17、17:17、20:17
    - cron: "17 0,3,6,9,12 * * *"

  workflow_dispatch:
    inputs:
      send_test:
        description: "发送一条霍邱招标雷达微信测试消息"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: toolbox-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    outputs:
      artifact_uploaded: ${{ steps.pages_artifact.outcome }}
    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验招投标脚本语法
        run: python -m compileall -q apps/tender/scripts

      - name: 测试公告开标与投标截止时间解析
        run: python -m unittest discover -s apps/tender/tests -p "test_*.py"

      - name: 校验竞争情报采集器和通知脚本
        run: python -m compileall -q apps/competitors/scripts apps/competitors/tests

      - name: 竞争情报单元测试
        run: python -m unittest discover -s apps/competitors/tests -p "test_*.py" -v

      - name: 竞争情报网页 JavaScript 语法检查
        run: node --check apps/competitors/assets/app.js

      - name: 校验软考题库
        run: python apps/ruankao/scripts/validate_questions.py apps/ruankao/data/questions.json

      - name: 安装 Chromium
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-tender]') || contains(github.event.head_commit.message, '[refresh-competitors]')
        run: python -m playwright install --with-deps chromium

      - name: 更新招投标数据
        id: tender_fetch
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-tender]')
        continue-on-error: true
        run: python apps/tender/scripts/fetch_tenders.py

      - name: 霍邱关键词监控与微信提醒
        id: huoqiu_monitor
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-tender]')
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TENDER_FETCH_OUTCOME: ${{ steps.tender_fetch.outcome }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          EXTRA_ARGS=""
          if [ "$SEND_TEST" = "true" ]; then
            EXTRA_ARGS="--test"
          fi
          python apps/tender/scripts/monitor_huoqiu.py $EXTRA_ARGS

      - name: 保存招投标数据和监控状态
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-tender]')) && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/tender/data/projects.json \
            apps/tender/data/meta.json \
            apps/tender/data/monitor_state.json \
            apps/tender/data/monitor_status.json
          if git diff --cached --quiet; then
            echo "项目数据和监控状态均无变化"
          else
            git commit -m "[skip ci] 更新招投标数据与霍邱监控状态"
            git push
          fi

      - name: 采集霍邱竞争情报
        id: competitors_fetch
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-competitors]')
        continue-on-error: true
        run: python apps/competitors/scripts/collect.py --max-new 100

      - name: 开标与中标情报微信提醒
        id: competitors_notify
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-competitors]')
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ "${{ steps.competitors_fetch.outcome }}" = "success" ]; then
            python apps/competitors/scripts/notify.py
          else
            echo "采集未成功：不发送可能不完整的新公告消息"
          fi

      - name: 保存竞争情报公开数据与通知状态
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-competitors]')) && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/competitors/data/records.json apps/competitors/data/notify_state.json
          if git diff --cached --quiet; then
            echo "竞争情报数据没有变化"
          else
            git commit -m "[skip ci] 更新竞争情报公开数据"
            git push
          fi

      - name: 配置 GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        id: pages_artifact
        if: success() || (steps.tender_fetch.outcome == 'failure' || steps.competitors_fetch.outcome == 'failure')
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: 标记抓取或提醒失败
        if: |
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-tender]') || contains(github.event.head_commit.message, '[refresh-competitors]')) &&
          (steps.tender_fetch.outcome == 'failure' || steps.huoqiu_monitor.outcome == 'failure' || steps.competitors_fetch.outcome == 'failure' || steps.competitors_notify.outcome == 'failure')
        run: |
          echo "抓取或微信提醒存在失败；状态文件已经保存并部署到网页。"
          exit 1

  deploy-pages:
    name: 发布 KK 万能工具箱到 GitHub Pages
    needs: build-and-deploy
    if: ${{ always() && needs.build-and-deploy.outputs.artifact_uploaded == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 从已完成的构建任务中部署网页
        id: deployment
        uses: actions/deploy-pages@v4
